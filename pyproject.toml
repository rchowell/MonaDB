[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "monadb"
version = "0.1.0"
description = "MonaDB — an embedded, dict-like SQL engine with a Python API."
requires-python = ">=3.9"
readme = "README.md"

[tool.maturin]
# Build the monadb crate with its `python` feature so the pyo3 module is compiled in.
features = ["python"]
# The compiled extension is installed at monadb/_monadb.*.so
module-name = "monadb._monadb"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["monadb/tests"]

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.7,<2"]
