[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "monadb"
dynamic = ["version"]
description = "MonaDB — an embedded document store with Python dict semantics and transactions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "R. Conner Howell", email = "rchowell19@gmail.com" }]
keywords = ["database", "embedded", "document-store", "redb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
]
[project.urls]
Homepage = "https://github.com/rchowell/MonaDB"
Repository = "https://github.com/rchowell/MonaDB"
Documentation = "https://github.com/rchowell/MonaDB#readme"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "monadb._monadb"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.7,<2", "pydantic>=2"]
