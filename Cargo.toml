[package]
name = "monadb"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[lints.clippy]
pedantic = "warn"

[build-dependencies]
lalrpop = "0.21.0"

[dependencies]
bytes = "1.9.0"
heed = "0.22.1"
byteorder = "1.5.0"
lalrpop-util = { version = "0.21.0", features = ["lexer", "unicode"] }
logos = "0.14.2"
tempfile = "3.14.0"
serde_json = { version = "1.0", features = ["preserve_order"] }
# BEGIN TODO: put behind "shell"
clap = { version = "4.5.16", features = ["derive"] }
rustyline = { version = "14.0.0", features = ["derive"] }
shlex = "1.3.0"
termcolor = "1.4.1"
# END TODO: put behind "shell"
