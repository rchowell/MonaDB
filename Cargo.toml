[package]
name = "monadb"
version = "0.1.0"
edition = "2024"
description = "Embedded document database with a SQL dialect compiled to stack-based bytecode"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/rchowell/MonaDB"
homepage = "https://github.com/rchowell/MonaDB"
authors = ["R. Conner Howell <rchowell19@gmail.com>"]
keywords = ["database", "embedded", "sql", "lmdb", "document-store"]
categories = ["database", "parser-implementations"]
# Bench targets are declared explicitly; the flat files in `benches/` are shared
# modules, not standalone benchmarks.
autobenches = false
exclude = [
    "site/",
    "docs/",
    "examples/",
    ".github/",
    ".context/",
    "homebrew-tap/",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]
cli = ["dep:rustyline", "dep:clap", "dep:termcolor", "dep:shlex"]

[[bin]]
name = "monadb"
path = "src/bin/monadb.rs"
required-features = ["cli"]

[build-dependencies]
lalrpop = "0.21.0"
serde = {version = "1", features = ["derive"]}
serde_yaml = "0.9"

[dependencies]
bytes = "1.9.0"
rustc-hash = "2"
heed = "0.22.1"
lalrpop-util = {version = "0.21.0", features = ["lexer", "unicode"]}
logos = "0.14.2"
serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0", features = ["preserve_order"]}
csv = "1.3"
tempfile = "3.14.0"
pyo3 = {version = "0.23", optional = true, features = [
    "extension-module",
    "abi3-py39",
]}
rustyline = {version = "14.0.0", optional = true, features = ["derive"]}
clap = {version = "4.5", optional = true, features = ["derive"]}
termcolor = {version = "1.4", optional = true}
shlex = {version = "1.3", optional = true}

[dev-dependencies]
hegeltest = "0.18"
serde = {version = "1", features = ["derive"]}
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.14.0"
criterion = "0.5"
rusqlite = {version = "0.32", features = ["bundled"]}
rand = "0.8"
rand_chacha = "0.3"
libc = "0.2"
iai-callgrind = "0.14"
iai-callgrind-runner = "0.14"
dhat = "0.3"
divan = "0.1"

[[bench]]
name = "doc_workloads"
harness = false
path = "benches/main.rs"

[[bench]]
name = "metrics"
harness = false
path = "benches/metrics.rs"

[[bench]]
name = "insert_breakdown"
harness = false
path = "benches/insert_breakdown.rs"

[[bench]]
name = "dhat_probe"
harness = false
path = "benches/dhat_probe.rs"

[[bench]]
name = "divan"
harness = false
path = "benches/divan.rs"

[[bench]]
name = "cache"
harness = false
path = "benches/cache.rs"

[[bench]]
name = "keying"
harness = false
path = "benches/keying.rs"

[[bench]]
name = "alloc_hotpath"
harness = false
path = "benches/alloc_hotpath.rs"

[lints.clippy]
pedantic = {level = "warn", priority = -1}
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.profiling]
inherits = "release"
debug = true
strip = false
