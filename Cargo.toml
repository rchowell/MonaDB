[package]
name = "rho"
version = "0.1.0"
edition = "2021"

[build-dependencies]
lalrpop = "0.21.0"

[dependencies]
clap = { version = "4.5.16", features = ["derive"] }
lalrpop-util = { version = "0.21.0", features = ["lexer", "unicode"] }
rusqlite = { version = "0.32.0", features = ["bundled"] }
rustyline = { version = "14.0.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3.0"
sqlparser = "0.50.0"
