[package]
name = "monadb"
version = "0.1.0"
edition = "2024"

[build-dependencies]
lalrpop = "0.21.0"

[dependencies]
bytes = "1.9.0"
heed = "0.22.1"
lalrpop-util = { version = "0.21.0", features = ["lexer", "unicode"] }
logos = "0.14.2"
serde ={ version = "1.0"}
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3.14.0"

[lints.clippy]
pedantic = "warn"
