[package]
name = "monadb"
version = "0.1.0"
edition = "2024"
description = "Embedded document database with a SQL dialect compiled to stack-based bytecode"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/rchowell/MonaDB"
homepage = "https://github.com/rchowell/MonaDB"
authors = ["R. Conner Howell <rchowell19@gmail.com>"]
keywords = ["database", "embedded", "sql", "lmdb", "document-store"]
categories = ["database", "parser-implementations"]
exclude = [
    "site/",
    "docs/",
    "examples/",
    ".github/",
    ".context/",
    "homebrew-tap/",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]
cli = ["dep:rustyline", "dep:clap", "dep:termcolor", "dep:shlex"]

[[bin]]
name = "monadb"
path = "src/bin/monadb.rs"
required-features = ["cli"]

[build-dependencies]
lalrpop = "0.21.0"
serde = {version = "1", features = ["derive"]}
serde_yaml = "0.9"

[dependencies]
bytes = "1.9.0"
heed = "0.22.1"
lalrpop-util = {version = "0.21.0", features = ["lexer", "unicode"]}
logos = "0.14.2"
serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0", features = ["preserve_order"]}
csv = "1.3"
tempfile = "3.14.0"
pyo3 = {version = "0.23", optional = true, features = [
    "extension-module",
    "abi3-py39",
]}
rustyline = {version = "14.0.0", optional = true, features = ["derive"]}
clap = {version = "4.5", optional = true, features = ["derive"]}
termcolor = {version = "1.4", optional = true}
shlex = {version = "1.3", optional = true}

[dev-dependencies]
hegeltest = "0.18"
serde = {version = "1", features = ["derive"]}
serde_yaml = "0.9"
tempfile = "3.14.0"

[lints.clippy]
missing_errors_doc = "allow"
pedantic = {level = "warn", priority = -1}
must_use_candidate = "allow"
