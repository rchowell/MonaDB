[package]
name = "monadb"
version = "0.2.0"
edition = "2024"
description = "Embedded document store with Python dict semantics"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/rchowell/MonaDB"
homepage = "https://github.com/rchowell/MonaDB"
authors = ["R. Conner Howell <rchowell19@gmail.com>"]
keywords = ["database", "embedded", "document-store", "redb"]
categories = ["database"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
redb = "4.1"
bson = "3.1"
pyo3 = {version = "0.29", features = ["abi3-py39"]}

[dev-dependencies]
# The same dependency with one extra feature, so `cargo test` can embed a Python
# interpreter. Wheel builds instead enable `pyo3/extension-module` via
# `[tool.maturin]`; that feature makes a test binary unlinkable.
pyo3 = {version = "0.29", features = ["auto-initialize"]}

[lints.clippy]
pedantic = {level = "warn", priority = -1}
must_use_candidate = "allow"
missing_errors_doc = "allow"
