suite: get
spec_ref: "§3.3"
description: >
  Key-index point lookup. A keyed table behaves like a big dict: `table[key]`
  resolves the receiver to a table (not a value) and does an order-preserving
  btree point lookup, returning the stored row — or null when the key is absent
  (Redis GET → nil). It is an ordinary expression, so it composes and rides the
  bare `select <expr>` form. v1 covers single-column AND composite full-key
  literal lookups; partial-key (leading-prefix) sub-sequence access is specified
  but deferred to a later pass and is not yet covered here.

setup:
  - create table t (id int);

tests:

  - id: get-int-key
    description: indexing by an existing int key returns the whole row
    steps:
      - sql: |
          insert into t ({id: 1, v: "a"});
      - sql: |
          select t[1];
        result:
          - {id: 1, v: "a"}

  - id: get-miss
    description: a missing key yields null (dict-get → nil), one row
    steps:
      - sql: |
          insert into t ({id: 1, v: "a"});
      - sql: |
          select t[99];
        result:
          - null

  - id: get-miss-empty-table
    description: indexing an empty table yields null
    steps:
      - sql: |
          select t[1];
        result:
          - null

  - id: get-string-key
    description: a string-keyed table indexes by a string literal
    steps:
      - sql: |
          create table s (id string);
      - sql: |
          insert into s ({id: "x", v: 9});
      - sql: |
          select s["x"];
        result:
          - {id: "x", v: 9}

  - id: get-after-overwrite
    description: re-inserting a key overwrites; the lookup sees the latest value
    steps:
      - sql: |
          insert into t ({id: 1, v: 100});
      - sql: |
          insert into t ({id: 1, v: 200});
      - sql: |
          select t[1];
        result:
          - {id: 1, v: 200}

  - id: get-composes
    description: the looked-up row is a value and can be indexed further
    steps:
      - sql: |
          insert into t ({id: 1, v: "a"});
      - sql: |
          select t[1].v;
        result:
          - "a"

  - id: get-among-rows
    description: the lookup picks exactly one row out of many, ignoring the rest
    steps:
      - sql: |
          insert into t ({id: 1, v: "a"}, {id: 2, v: "b"}, {id: 3, v: "c"});
      - sql: |
          select t[2];
        result:
          - {id: 2, v: "b"}

  - id: get-wrong-type
    description: a string key against an int-keyed table is a schema error
    steps:
      - sql: |
          select t["a"];
        error: schema

  - id: get-keyless
    description: a keyless table cannot be indexed by key
    steps:
      - sql: |
          create table k;
      - sql: |
          select k[1];
        error: static

  - id: get-composite-arity
    description: a key tuple longer than the key-column count is a static error
    steps:
      - sql: |
          create table c (a int, b int);
      - sql: |
          select c[1, 2, 3];
        error: static

  - id: get-composite-full-key
    description: a full composite key returns the one matching row
    steps:
      - sql: |
          create table c (a string, b int);
      - sql: |
          insert into c ({a: "x", b: 7, v: "hit"});
      - sql: |
          select c["x", 7];
        result:
          - {a: "x", b: 7, v: "hit"}

  # Partial-key (leading-prefix → sub-sequence) cases are deferred to the
  # partial-key pass and are intentionally not present yet. An arity less than
  # the key-column count is a PARTIAL key (a deferred sub-sequence lookup), not
  # an error, under the reconciled key model.

  - id: get-composite-miss
    description: a full composite key with no matching row yields null
    steps:
      - sql: |
          create table c (a string, b int);
      - sql: |
          insert into c ({a: "x", b: 7});
      - sql: |
          select c["x", 8];
        result:
          - null

  - id: get-unknown-table
    description: indexing a name that is neither a binding nor a table is unbound
    steps:
      - sql: |
          select ghost[1];
        error: static
