suite: select-clause
spec_ref: "§4.1"
description: Branches of the select constructor (., *, expr, item-list) paired with a single from source.

setup:
  - create table T;

tests:

  - id: select-dot
    description: "select . emits the binding tuple as an envelope object"
    steps:
      - sql: |
          insert into T ({x: 1});
      - sql: |
          select . from T as t;
        result:
          - {t: {x: 1}}

  - id: select-star
    description: select * spreads bindings flat
    steps:
      - sql: |
          insert into T ({x: 1, y: 2});
      - sql: |
          select * from T as t;
        result:
          - {x: 1, y: 2}

  - id: select-expr-path
    description: select <path-expr> emits a scalar per row
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          select t.x from T as t order t.x;
        result: [1, 2]

  - id: select-expr-literal
    description: select <literal-expr> emits the literal once per row
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          select 7 from T as t order t.x;
        result: [7, 7]

  - id: select-expr-object
    description: select <object-expr> emits the object once per row
    steps:
      - sql: |
          insert into T ({x: 1});
      - sql: |
          "select {a: t.x} from T as t;"
        result:
          - {a: 1}

  - id: select-list-single-item
    description: select <expr> as <name> emits an object with the named field
    steps:
      - sql: |
          insert into T ({x: 10});
      - sql: |
          select t.x as a from T as t;
        result:
          - {a: 10}

  - id: select-list-multi-item
    description: a list of items emits an object with each named member
    steps:
      - sql: |
          insert into T ({x: 1, y: 2});
      - sql: |
          select t.x as a, t.y as b from T as t;
        result:
          - {a: 1, b: 2}

  - id: select-list-literal-item
    description: list items may be arbitrary expressions, not only paths
    steps:
      - sql: |
          insert into T ({x: 1});
      - sql: |
          select 1 as a, 'hi' as b from T as t;
        result:
          - {a: 1, b: "hi"}

  - id: from-bare-table
    description: from <ident> uses the table name as the implicit alias
    steps:
      - sql: |
          insert into T ({x: 1});
      - sql: |
          select T.x from T;
        result: [1]

  - id: from-table-with-as-alias
    description: from <ident> as <ident> binds the source under an explicit alias
    steps:
      - sql: |
          insert into T ({x: 7});
      - sql: |
          select t.x from T as t;
        result: [7]

  - id: from-table-with-implicit-alias
    description: from <ident> <ident> binds the source under an alias without 'as'
    steps:
      - sql: |
          insert into T ({x: 9});
      - sql: |
          select t.x from T t;
        result: [9]

  - id: select-expr-array
    description: an array literal builds an array from its element expressions
    steps:
      - sql: |
          insert into T ({x: 7});
      - sql: |
          select [1, 2, t.x] as a from T as t;
        result:
          - {a: [1, 2, 7]}

  - id: select-expr-array-nested
    description: array literals may nest
    steps:
      - sql: |
          insert into T ({x: 1});
      - sql: |
          select [[1, 2], [3]] as a from T as t;
        result:
          - {a: [[1, 2], [3]]}
