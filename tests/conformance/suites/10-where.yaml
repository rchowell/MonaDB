suite: where-clause
spec_ref: "§4.4"
description: Filters binding tuples by boolean predicate (residual scan filter).

setup:
  - create table T;

tests:

  - id: where-constant-true
    description: constant true keeps all rows
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: select * from T where true;
        result:
          - {x: 1}
          - {x: 2}

  - id: where-constant-false
    description: constant false drops all rows
    steps:
      - sql: |
          insert into T ({x: 1});
      - sql: select * from T where false;
        result: []

  - id: where-constant-null
    description: null predicate is not-true and drops all rows
    steps:
      - sql: |
          insert into T ({x: 1});
      - sql: select * from T where null;
        result: []

  - id: where-numeric-gt
    description: numeric greater-than filters by oid insertion order
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: select * from T where T.x > 1;
        result:
          - {x: 2}
          - {x: 3}

  - id: where-numeric-eq
    description: numeric equality matches a single row
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: select * from T where T.x = 2;
        result:
          - {x: 2}

  - id: where-numeric-ne
    description: numeric inequality excludes matching value
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: select * from T where T.x != 1;
        result:
          - {x: 2}
          - {x: 3}

  - id: where-string-eq
    description: string equality in where
    setup:
      - create table S;
    steps:
      - sql: |
          insert into S ({name: 'alice'}, {name: 'bob'});
      - sql: select * from S where S.name = 'bob';
        result:
          - {name: "bob"}

  - id: where-bool-eq
    description: boolean equality in where
    steps:
      - sql: |
          insert into T ({flag: true}, {flag: false});
      - sql: select * from T where T.flag = true;
        result:
          - {flag: true}

  - id: where-explicit-alias
    description: predicate may use an explicit from alias
    steps:
      - sql: |
          insert into T ({x: 0}, {x: 1});
      - sql: select * from T as t where t.x > 0;
        result:
          - {x: 1}

  - id: where-null-member
    description: null member compares equal to null
    steps:
      - sql: |
          insert into T ({x: null});
      - sql: select * from T where T.x = null;
        result:
          - {x: null}

  - id: where-null-member-ne
    description: null member fails inequality against non-null
    steps:
      - sql: |
          insert into T ({x: null});
      - sql: select * from T where T.x != 1;
        result: []

  - id: where-absent-member-eq-null
    description: absent field reads as null and matches null
    steps:
      - sql: |
          insert into T ({});
      - sql: select * from T where T.x = null;
        result:
          - {}

  - id: where-absent-member-gt
    description: absent field reads as null and fails ordering comparison
    steps:
      - sql: |
          insert into T ({});
      - sql: select * from T where T.x > 0;
        result: []

  - id: where-absent-vs-present
    description: only rows with present matching field pass equality
    steps:
      - sql: |
          insert into T ({x: 1}, {});
      - sql: select * from T where T.x = 1;
        result:
          - {x: 1}

  - id: from-where-filter
    description: scalar projection with where (moved from from-clause suite)
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: select T.x from T where T.x > 1;
        result: [2, 3]

