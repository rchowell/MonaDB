suite: drop
spec_ref: "§7.2"
description: drop table — removes the table from the catalog and clears its data.

tests:
  - id: drop-makes-table-unresolvable
    description: after drop, the table can no longer be selected from
    steps:
      - sql: |
          create table T;
      - sql: |
          insert into T ({x: 1});
      - sql: |
          drop table T;
      - sql: |
          select * from T;
        error: static

  - id: drop-then-recreate-is-empty
    description: a table re-created after drop is fresh and empty
    steps:
      - sql: |
          create table T;
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          drop table T;
      - sql: |
          create table T;
      - sql: |
          select * from T;
        result: []

  - id: drop-unknown-table
    description: dropping an undeclared table is a static error
    steps:
      - sql: |
          drop table Ghost;
        error: static

  - id: drop-system-table-rejected
    description: dropping the reserved catalog table is a static error
    steps:
      - sql: |
          drop table catalog;
        error: static
