suite: clear
spec_ref: "§7.3"
description: clear table — empties the table's data but keeps it registered in the catalog.

tests:
  - id: clear-empties-table
    description: clear removes every row but leaves the table in place
    steps:
      - sql: |
          create table T;
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: |
          clear table T;
      - sql: |
          select * from T;
        result: []

  - id: clear-keeps-table-usable
    description: a cleared table is still resolvable and accepts new rows
    steps:
      - sql: |
          create table T;
      - sql: |
          insert into T ({x: 1});
      - sql: |
          clear table T;
      - sql: |
          insert into T ({x: 9});
      - sql: |
          select * from T;
        result:
          - {x: 9}

  - id: clear-unknown-table
    description: clearing an undeclared table is a static error
    steps:
      - sql: |
          clear table Ghost;
        error: static
