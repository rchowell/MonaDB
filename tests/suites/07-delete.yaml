suite: delete
spec_ref: "7.1"
description: delete from table — delete-all and predicate-filtered deletes.

setup:
  - create table T;

tests:
  - id: delete-all-empties-table
    description: delete with no where removes every row
    steps:
      - sql: |
          insert into T ({"x": 1}, {"x": 2}, {"x": 3});
      - sql: |
          delete from T;
      - sql: |
          select * from T;
        result: []

  - id: delete-where-removes-matching
    description: delete with a predicate removes only matching rows
    steps:
      - sql: |
          insert into T ({"x": 1}, {"x": 2}, {"x": 3});
      - sql: |
          delete from T where T.x > 1;
      - sql: |
          select * from T;
        result:
          - {x: 1}

  - id: delete-where-alias
    description: an explicit `as` alias binds the predicate's references
    steps:
      - sql: |
          insert into T ({"x": 1}, {"x": 2}, {"x": 3});
      - sql: |
          delete from T as r where r.x = 2;
      - sql: |
          select * from T;
        result:
          - {x: 1}
          - {x: 3}

  - id: delete-where-none-matched
    description: a predicate that matches nothing leaves the table unchanged
    steps:
      - sql: |
          insert into T ({"x": 1}, {"x": 2}, {"x": 3});
      - sql: |
          delete from T where T.x > 100;
      - sql: |
          select * from T;
        result:
          - {x: 1}
          - {x: 2}
          - {x: 3}

  - id: delete-empty-table-noop
    description: deleting from an empty table succeeds and yields nothing
    steps:
      - sql: |
          delete from T;
      - sql: |
          select * from T;
        result: []

  - id: delete-then-insert-reuses-table
    description: a table is reusable after a delete-all
    steps:
      - sql: |
          insert into T ({"x": 1}, {"x": 2});
      - sql: |
          delete from T;
      - sql: |
          insert into T ({"x": 9});
      - sql: |
          select * from T;
        result:
          - {x: 9}

  - id: delete-unknown-table
    description: deleting from an undeclared table is a static error
    steps:
      - sql: |
          delete from Ghost;
        error: static
