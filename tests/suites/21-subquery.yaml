suite: subquery
spec_ref: "4.10"
description: >
  Subqueries — a nested select compiled inline as a bag of rows (a Value::Array
  on the stack). Scalar subqueries coerce that bag to a single value (empty →
  null, more than one row → runtime error); FROM derived tables iterate it;
  IN/EXISTS/ANY/ALL test it. Subqueries may be correlated (the inner query
  references an outer binding) and re-run per outer row.

setup:
  - create table T;
  - create table S;

tests:

  #----------------------------------------------------------------------------
  # scalar subqueries
  #----------------------------------------------------------------------------

  - id: scalar-uncorrelated-count
    description: a scalar subquery in projection with no outer from
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: select (select count(*) from T as t);
        result: [3]

  - id: scalar-aliased-member
    description: a scalar subquery aliased into a projection member
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: 'select (select count(*) from T as t) as n;'
        result:
          - {n: 3}

  - id: scalar-empty-is-null
    description: a scalar subquery over an empty bag coerces to null
    steps:
      - sql: select (select t.x from T as t);
        result: [null]

  - id: scalar-aggregate-empty-null
    description: an aggregate scalar subquery over an empty table is null
    steps:
      - sql: select (select max(t.x) from T as t);
        result: [null]

  - id: scalar-too-many-rows
    description: a scalar subquery returning more than one row is a runtime error
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: select (select t.x from T as t);
        error: runtime

  - id: scalar-in-where
    description: a scalar subquery as a where comparand
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: |
          insert into S ({v: 2}, {v: 3});
      - sql: select t.x from T as t where t.x = (select max(s.v) from S as s);
        result: [3]

  - id: scalar-correlated
    description: a correlated scalar subquery re-runs per outer row
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          insert into S ({g: 1}, {g: 1}, {g: 2});
      - sql: 'select t.x as x, (select count(*) from S as s where s.g = t.x) as n from T as t;'
        result:
          - {x: 1, n: 2}
          - {x: 2, n: 1}

  - id: scalar-single-row
    description: a non-aggregate scalar subquery over exactly one row is that value
    steps:
      - sql: |
          insert into T ({x: 7});
      - sql: select (select t.x from T as t);
        result: [7]

  - id: scalar-in-expr
    description: a scalar subquery composes as an operand of an arithmetic expression
    steps:
      - sql: |
          insert into T ({x: 10}, {x: 20});
      - sql: |
          insert into S ({v: 5});
      - sql: 'select t.x + (select max(s.v) from S as s) as y from T as t;'
        result:
          - {y: 15}
          - {y: 25}

  #----------------------------------------------------------------------------
  # from derived tables
  #----------------------------------------------------------------------------

  - id: derived-basic
    description: a derived table filters then projects in the outer query
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: select d.x from (select t.x as x from T as t where t.x > 1) as d;
        result: [2, 3]

  - id: derived-star
    description: select * over a derived table
    steps:
      - sql: |
          insert into T ({x: 1, y: 2});
      - sql: select * from (select t.x as x, t.y as y from T as t) as d;
        result:
          - {x: 1, y: 2}

  - id: derived-correlated-lateral
    description: a lateral derived table references an earlier from binding
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          insert into S ({g: 1, v: 10}, {g: 1, v: 11}, {g: 2, v: 20});
      - sql: 'select t.x as x, d.n as n from T as t, (select s.v as n from S as s where s.g = t.x) as d;'
        result:
          - {x: 1, n: 10}
          - {x: 1, n: 11}
          - {x: 2, n: 20}

  - id: derived-group-by
    description: a derived table containing group by (sink through cc_group)
    steps:
      - sql: |
          insert into T ({g: "a"}, {g: "b"}, {g: "a"});
      - sql: 'select d.g as g, d.n as n from (select t.g as g, count(*) as n from T as t group by t.g) as d;'
        result:
          - {g: "a", n: 2}
          - {g: "b", n: 1}

  - id: derived-order-limit
    description: a derived table containing order by + limit (sink through cc_order)
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: select d.x from (select t.x as x from T as t order by t.x desc limit 2) as d;
        result: [3, 2]

  - id: derived-requires-alias
    description: a derived-table source requires an alias
    steps:
      - sql: select x from (select t.x as x from T as t);
        error: static

  - id: derived-cross-base
    description: an uncorrelated derived table cross-joined with a base table
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          insert into S ({v: 2}, {v: 3});
      - sql: 'select t.x as x, d.v as v from T as t, (select s.v as v from S as s where s.v = 2) as d;'
        result:
          - {x: 1, v: 2}
          - {x: 2, v: 2}

  - id: nested-derived
    description: a derived table whose source is itself a derived table
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: select dd.x from (select d.x as x from (select t.x as x from T as t where t.x > 1) as d) as dd;
        result: [2, 3]

  #----------------------------------------------------------------------------
  # IN / NOT IN
  #----------------------------------------------------------------------------

  - id: in-subquery
    description: membership against a subquery bag
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: |
          insert into S ({v: 2}, {v: 3});
      - sql: select t.x from T as t where t.x in (select s.v from S as s);
        result: [2, 3]

  - id: not-in-subquery
    description: non-membership against a subquery bag
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: |
          insert into S ({v: 2}, {v: 3});
      - sql: select t.x from T as t where t.x not in (select s.v from S as s);
        result: [1]

  - id: in-empty-subquery
    description: in over an empty bag matches nothing
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: select t.x from T as t where t.x in (select s.v from S as s);
        result: []

  - id: not-in-empty-subquery
    description: not in over an empty bag matches everything
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: select t.x from T as t where t.x not in (select s.v from S as s);
        result: [1, 2]

  - id: not-in-null-element
    description: not in with a null element is unknown (3VL), excluding the row
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          insert into S ({v: 2}, {v: null});
      - sql: select t.x from T as t where t.x not in (select s.v from S as s);
        result: []

  - id: in-null-operand
    description: a null left operand of in is unknown (3VL), excluding the row
    steps:
      - sql: |
          insert into T ({x: null}, {x: 2});
      - sql: |
          insert into S ({v: 2}, {v: 3});
      - sql: select t.x from T as t where t.x in (select s.v from S as s);
        result: [2]

  #----------------------------------------------------------------------------
  # EXISTS / NOT EXISTS
  #----------------------------------------------------------------------------

  - id: exists-correlated
    description: exists over a correlated subquery
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          insert into S ({g: 1});
      - sql: select t.x from T as t where exists (select s.g from S as s where s.g = t.x);
        result: [1]

  - id: not-exists-correlated
    description: not exists over a correlated subquery
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          insert into S ({g: 1});
      - sql: select t.x from T as t where not exists (select s.g from S as s where s.g = t.x);
        result: [2]

  - id: exists-uncorrelated-nonempty
    description: exists over a non-empty uncorrelated subquery is true for all rows
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          insert into S ({g: 9});
      - sql: select t.x from T as t where exists (select s.g from S as s);
        result: [1, 2]

  - id: exists-empty-false
    description: exists over an empty subquery is false
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: select t.x from T as t where exists (select s.g from S as s);
        result: []

  #----------------------------------------------------------------------------
  # ANY / ALL
  #----------------------------------------------------------------------------

  - id: gt-any
    description: x > any (bag) is true when x exceeds the minimum
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 5}, {x: 10});
      - sql: |
          insert into S ({v: 3}, {v: 8});
      - sql: select t.x from T as t where t.x > any (select s.v from S as s);
        result: [5, 10]

  - id: gt-all
    description: x > all (bag) is true when x exceeds the maximum
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 5}, {x: 10});
      - sql: |
          insert into S ({v: 3}, {v: 8});
      - sql: select t.x from T as t where t.x > all (select s.v from S as s);
        result: [10]

  - id: eq-any-equals-in
    description: x = any (bag) is equivalent to in
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: |
          insert into S ({v: 2}, {v: 3});
      - sql: select t.x from T as t where t.x = any (select s.v from S as s);
        result: [2, 3]

  - id: any-empty-false
    description: any over an empty bag is false
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: select t.x from T as t where t.x > any (select s.v from S as s);
        result: []

  - id: all-empty-true
    description: all over an empty bag is true
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: select t.x from T as t where t.x > all (select s.v from S as s);
        result: [1, 2]

  - id: all-null-unknown
    description: all with a null element is unknown (3VL), excluding the row
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 10});
      - sql: |
          insert into S ({v: 3}, {v: null});
      - sql: select t.x from T as t where t.x > all (select s.v from S as s);
        result: []

  - id: lt-all
    description: x < all (bag) is true when x is below the minimum
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 5}, {x: 10});
      - sql: |
          insert into S ({v: 3}, {v: 8});
      - sql: select t.x from T as t where t.x < all (select s.v from S as s);
        result: [1]

  - id: ne-all-equals-not-in
    description: x != all (bag) is equivalent to not in
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: |
          insert into S ({v: 2}, {v: 3});
      - sql: select t.x from T as t where t.x != all (select s.v from S as s);
        result: [1]

  - id: any-null-match-wins
    description: a real match makes = any true even when the bag holds a null
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: |
          insert into S ({v: 2}, {v: null});
      - sql: select t.x from T as t where t.x = any (select s.v from S as s);
        result: [2]

  #----------------------------------------------------------------------------
  # nested subqueries and parameters
  #----------------------------------------------------------------------------

  - id: in-with-order-limit
    description: a subquery with order by + limit on the right of in
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: |
          insert into S ({v: 3}, {v: 2}, {v: 1});
      - sql: select t.x from T as t where t.x in (select s.v from S as s order by s.v limit 1);
        result: [1]

  - id: nested-subquery
    description: a subquery whose predicate contains another subquery
    setup:
      - create table U;
    steps:
      - sql: |
          insert into T ({x: 1});
      - sql: |
          insert into S ({g: 5});
      - sql: |
          insert into U ({w: 5});
      - sql: select t.x from T as t where exists (select s.g from S as s where s.g in (select u.w from U as u));
        result: [1]

  - id: param-in-subquery
    description: a query parameter resolves inside a subquery
    steps:
      - sql: |
          insert into T ({x: 2});
      - sql: |
          insert into S ({v: 1}, {v: 2});
      - sql: select t.x from T as t where t.x in (select s.v from S as s where s.v > ?);
        parameters: [1]
        result: [2]

  - id: agg-with-scalar-subquery
    description: >
      an outer aggregate and a scalar subquery with its own aggregate stay at
      separate query levels — the inner count is not folded into the outer
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          insert into S ({v: 1}, {v: 2}, {v: 3});
      - sql: 'select count(*) as c, (select count(*) from S as s) as d from T as t;'
        result:
          - {c: 2, d: 3}

  #----------------------------------------------------------------------------
  # subqueries inside GROUP BY — KNOWN GAP (currently failing)
  #
  # A subquery embedded in a grouped query's projection or HAVING crashes at
  # runtime ("load on unpositioned cursor"): the two-pass `cc_group` path leaves
  # the group cursor unpositioned when the inline subquery scan runs in phase 2.
  # The ungrouped aggregate path (see `agg-with-scalar-subquery`) handles this
  # correctly, so the defect is specific to GROUP BY. These cases document the
  # correct expected behavior and stay red until the engine supports it.
  #----------------------------------------------------------------------------

  - id: subquery-in-grouped-projection
    description: a scalar subquery as a member of a grouped projection (known gap)
    steps:
      - sql: |
          insert into T ({g: "a"}, {g: "a"}, {g: "b"});
      - sql: |
          insert into S ({v: 1}, {v: 2});
      - sql: 'select t.g as g, count(*) as n, (select count(*) from S as s) as d from T as t group by t.g;'
        result:
          - {g: "a", n: 2, d: 2}
          - {g: "b", n: 1, d: 2}

  - id: subquery-in-having
    description: a scalar subquery as a having comparand (known gap)
    steps:
      - sql: |
          insert into T ({g: "a"}, {g: "a"}, {g: "b"});
      - sql: |
          insert into S ({v: 1}, {v: 2});
      - sql: 'select t.g as g, count(*) as n from T as t group by t.g having count(*) >= (select count(*) from S as s);'
        result:
          - {g: "a", n: 2}

  #----------------------------------------------------------------------------
  # deep correlation
  #----------------------------------------------------------------------------

  - id: correlated-two-level
    description: an inner subquery correlates to the binding of a middle subquery
    setup:
      - create table U;
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: |
          insert into S ({g: 1});
      - sql: |
          insert into U ({w: 1});
      - sql: 'select t.x from T as t where exists (select s.g from S as s where s.g = t.x and exists (select u.w from U as u where u.w = s.g));'
        result: [1]