suite: literals
spec_ref: "3.1"
description: Literal expressions — null, bool, number, string, array, object — evaluated via select with no from clause.

tests:
  - id: lit-null
    description: null literal evaluates to null
    steps:
      - sql: select null;
        result: [null]

  - id: lit-true
    description: true boolean literal
    steps:
      - sql: select true;
        result: [true]

  - id: lit-false
    description: false boolean literal
    steps:
      - sql: select false;
        result: [false]

  - id: lit-integer
    description: integer number literal
    steps:
      - sql: select 1;
        result: [1]

  - id: lit-float
    description: floating-point number literal
    steps:
      - sql: select 1.5;
        result: [1.5]

  - id: lit-large-integer
    description: integer at the edge of exact float representation (2^53)
    steps:
      - sql: select 9007199254740992;
        result: [9007199254740992]

  - id: lit-string-basic
    description: single-quoted string literal
    steps:
      - sql: select 'hello';
        result: ["hello"]

  - id: lit-string-empty
    description: empty string literal
    steps:
      - sql: select '';
        result: [""]

  - id: lit-string-escaped-quote
    description: embedded quote is escaped with a backslash
    steps:
      - sql: "select 'it\\'s';"
        result: ["it's"]

  - id: lit-string-double-quoted
    description: double-quoted string literal, equivalent to single-quoted
    steps:
      - sql: 'select "hello";'
        result: ["hello"]

  - id: lit-string-opposite-quote-literal
    description: the opposite delimiter needs no escape inside a string
    steps:
      - sql: 'select "it''s";'
        result: ["it's"]

  - id: lit-string-escapes
    description: backslash escapes for newline, tab, and backslash
    steps:
      - sql: "select 'a\\nb\\tc\\\\d';"
        result: ["a\nb\tc\\d"]

  - id: lit-string-unicode-escape
    description: backslash-u escape produces the corresponding Unicode scalar
    steps:
      - sql: "select '\\u00e9';"
        result: ["é"]

  - id: lit-string-bad-escape
    description: an unknown backslash escape is a syntax error
    steps:
      - sql: "select '\\q';"
        error: syntax

  - id: lit-string-unicode
    description: string with Unicode content
    steps:
      - sql: select 'café';
        result: ["café"]

  - id: lit-array-empty
    description: empty array literal
    steps:
      - sql: "select [];"
        result: [[]]

  - id: lit-array-two-elements
    description: array literal with two elements yields a single array value
    steps:
      - sql: "select [1, 2];"
        result: [[1, 2]]

  - id: lit-array-numbers
    description: array literal of numbers
    steps:
      - sql: "select [1, 2, 3];"
        result: [[1, 2, 3]]

  - id: lit-array-mixed
    description: array with mixed types
    steps:
      - sql: "select [1, 'a', null, true];"
        result: [[1, "a", null, true]]

  - id: lit-array-nested
    description: nested array literal
    steps:
      - sql: "select [[1, 2], [3, 4]];"
        result: [[[1, 2], [3, 4]]]

  - id: lit-object-empty
    description: empty object literal
    steps:
      - sql: "select {};"
        result: [{}]

  - id: lit-object-basic
    description: object literal with two members
    steps:
      - sql: "select {\"x\": 1, \"y\": 2};"
        result: [{x: 1, y: 2}]

  - id: lit-object-string-key
    description: object key as string literal
    steps:
      - sql: "select {'a-b': 1};"
        result: [{"a-b": 1}]

  - id: lit-object-nested
    description: nested object and array in a literal
    steps:
      - sql: "select {\"items\": [1, 2], \"meta\": {\"n\": 2}};"
        result: [{items: [1, 2], meta: {n: 2}}]

  - id: lit-object-bare-key-rejected
    description: a bare-identifier object key is a syntax error
    steps:
      - sql: "select {x: 1};"
        error: syntax

  - id: lit-object-nonbare-key-via-subscript
    description: a non-bare key is written as a string and read via subscript
    steps:
      - sql: "select t[\"weird key\"] from [{\"weird key\": 5}] as t;"
        result: [5]
