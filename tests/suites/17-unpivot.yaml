suite: unpivot-clause
spec_ref: "§4.2"
description: UNPIVOT ranges over the attribute-value pairs of a tuple, binding the value with AS and the attribute name with AT.

setup:
  - create table T;

tests:

  - id: unpivot-members-to-rows
    description: unpivot yields one binding per attribute-value pair, the value bound by AS
    steps:
      - sql: |
          select price from unpivot {amzn: 1900, goog: 1120} as price;
        result: [1900, 1120]

  - id: unpivot-at-binds-attribute-name
    description: AT binds the attribute name of each pair
    steps:
      - sql: |
          select sym as sym, price as price from unpivot {amzn: 1900, goog: 1120} as price at sym;
        result:
          - {sym: "amzn", price: 1900}
          - {sym: "goog", price: 1120}

  - id: unpivot-preserves-member-order
    description: pairs are produced in object member order
    steps:
      - sql: |
          select sym as sym from unpivot {c: 3, a: 1, b: 2} as price at sym;
        result:
          - {sym: "c"}
          - {sym: "a"}
          - {sym: "b"}

  - id: unpivot-at-optional
    description: AT may be omitted, binding only the value
    steps:
      - sql: |
          select price from unpivot {a: 10, b: 20} as price;
        result: [10, 20]

  - id: unpivot-dot-envelope
    description: select . envelopes the value and attribute bindings under their aliases
    steps:
      - sql: |
          select . from unpivot {a: 1, b: 2} as v at k;
        result:
          - {v: 1, k: "a"}
          - {v: 2, k: "b"}

  - id: unpivot-star
    description: select * spreads the scalar bindings under their aliases
    steps:
      - sql: |
          select * from unpivot {a: 1, b: 2} as v at k;
        result:
          - {v: 1, k: "a"}
          - {v: 2, k: "b"}

  - id: unpivot-where-on-name
    description: a where predicate may filter on the attribute name
    steps:
      - sql: |
          select price from unpivot {a: 1, b: 2, c: 3} as price at sym where sym != 'b';
        result: [1, 3]

  - id: unpivot-non-object-empty
    description: unpivot of a non-object value contributes no rows
    steps:
      - sql: |
          select price from unpivot 5 as price at sym;
        result: []

  - id: unpivot-empty-object
    description: unpivot of an empty object contributes no rows
    steps:
      - sql: |
          select price from unpivot {} as price;
        result: []

  - id: unpivot-lateral-table-row
    description: unpivot a table row's columns into (name, value) rows
    setup:
      - create table closing;
      - |
        insert into closing ({date: "d1", amzn: 1900, goog: 1120});
    steps:
      - sql: |
          select sym as sym, price as price from closing as c, unpivot c as price at sym where sym != 'date';
        result:
          - {sym: "amzn", price: 1900}
          - {sym: "goog", price: 1120}

  - id: unpivot-lateral-multi-row
    description: unpivot flattens every outer row's members in order
    setup:
      - create table P;
      - |
        insert into P ({a: 1, b: 2}, {a: 3, b: 4});
    steps:
      - sql: |
          select sym as k, price as v from P as p, unpivot p as price at sym;
        result:
          - {k: "a", v: 1}
          - {k: "b", v: 2}
          - {k: "a", v: 3}
          - {k: "b", v: 4}

  - id: unpivot-order-by
    description: order by sorts the unpivoted pairs by the attribute name
    steps:
      - sql: |
          select price from unpivot {b: 2, a: 1, c: 3} as price at sym order by sym;
        result: [1, 2, 3]

  - id: unpivot-requires-value-alias
    description: the unpivot value binding requires an alias
    steps:
      - sql: |
          select . from unpivot {a: 1};
        error: static
