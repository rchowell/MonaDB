suite: copy
tests:
  - id: copy-round-trip-csv
    steps:
      - sql: create table src;
      - sql: "insert into src ({\"name\": 'alice', \"age\": 30}, {\"name\": 'bob', \"age\": 25});"
      - sql: copy src to 'tests/fixtures/out.csv';
      - sql: create table dst;
      - sql: copy dst from 'tests/fixtures/out.csv';
      - sql: "select * from dst as d order by d.name;"
        result:
          - {name: alice, age: 30}
          - {name: bob, age: 25}

  - id: copy-query-to-jsonl
    steps:
      - sql: create table t;
      - sql: "insert into t ({\"x\": 1});"
      - sql: copy (select t.x as x from t as t) to 'tests/fixtures/out.jsonl';
      - sql: select read_jsonl('tests/fixtures/out.jsonl');
        result:
          - - {x: 1}

  - id: copy-from-streams-csv
    description: |
      A bulk import pulls one row at a time from the file instead of buffering
      the whole thing into an array first.
    steps:
      - sql: create table imported (name string);
      - sql: copy imported from 'tests/fixtures/people.csv';
      - sql: "select * from imported as i order by i.name;"
        result:
          - {name: alice, age: 30}
          - {name: bob, age: 25}

  - id: copy-from-streams-jsonl-into-keyless
    steps:
      - sql: create table landing;
      - sql: copy landing from 'tests/fixtures/people.jsonl';
      - sql: "select count(*) as n from landing as l;"
        result:
          - {n: 2}

  - id: copy-from-json-array
    description: a whole-document json source imports like any other file
    steps:
      - sql: create table j;
      - sql: copy j from 'tests/fixtures/people.json';
      - sql: "select j.name as name from j as j order by j.name;"
        result:
          - {name: alice}
          - {name: bob}

  - id: copy-round-trip-json
    steps:
      - sql: create table jsrc;
      - sql: "insert into jsrc ({\"x\": 1}, {\"x\": 2});"
      - sql: copy (select s.x as x from jsrc as s) to 'tests/fixtures/out.json';
      - sql: create table jdst;
      - sql: copy jdst from 'tests/fixtures/out.json';
      - sql: "select d.x as x from jdst as d order by d.x;"
        result:
          - {x: 1}
          - {x: 2}
