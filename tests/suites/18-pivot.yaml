suite: pivot-clause
spec_ref: "4.1"
description: PIVOT folds a binding stream into a single tuple, contributing one attribute per row — the value at the AT name.

setup:
  - create table T;

tests:

  - id: pivot-pairs-to-tuple
    description: pivot builds one object with an attribute per input row
    setup:
      - create table prices;
      - |
        insert into prices ({"sym": "amzn", "price": 1900}, {"sym": "goog", "price": 1120});
    steps:
      - sql: |
          pivot p.price at p.sym from prices as p;
        result:
          - {amzn: 1900, goog: 1120}

  - id: pivot-from-unpivot-roundtrip
    description: pivot inverts unpivot over the same value
    steps:
      - sql: |
          pivot price at sym from unpivot {"a": 1, "b": 2, "c": 3} as price at sym;
        result:
          - {a: 1, b: 2, c: 3}

  - id: pivot-empty-stream
    description: pivot over an empty stream yields a single empty object
    setup:
      - create table empty_t;
    steps:
      - sql: |
          pivot p.price at p.sym from empty_t as p;
        result:
          - {}

  - id: pivot-last-wins-duplicate
    description: a repeated attribute name is last-wins
    setup:
      - create table d;
      - |
        insert into d ({"k": "x", "v": 1}, {"k": "x", "v": 2});
    steps:
      - sql: |
          pivot e.v at e.k from d as e;
        result:
          - {x: 2}

  - id: pivot-skips-non-string-name
    description: a row whose AT name is not a string contributes no attribute
    setup:
      - create table m;
      - |
        insert into m ({"k": "ok", "v": 1}, {"k": 5, "v": 2});
    steps:
      - sql: |
          pivot e.v at e.k from m as e;
        result:
          - {ok: 1}

  - id: pivot-where-filters-pairs
    description: where filters which rows contribute attributes
    setup:
      - create table prices;
      - |
        insert into prices ({"sym": "a", "price": 1}, {"sym": "b", "price": 2}, {"sym": "c", "price": 3});
    steps:
      - sql: |
          pivot p.price at p.sym from prices as p where p.price > 1;
        result:
          - {b: 2, c: 3}

  - id: pivot-order-unsupported
    description: pivot with order by is not supported in v1
    setup:
      - create table prices;
    steps:
      - sql: |
          pivot p.price at p.sym from prices as p order by p.sym;
        error: static
