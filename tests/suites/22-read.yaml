suite: read
tests:
  - id: read-csv-builtin
    steps:
      - sql: select read_csv('tests/fixtures/people.csv');
        result:
          - - {name: alice, age: 30}
            - {name: bob, age: 25}

  - id: read-jsonl-builtin
    steps:
      - sql: select read_jsonl('tests/fixtures/people.jsonl');
        result:
          - - {name: alice, age: 30}
            - {name: bob, age: 25}

  - id: read-csv-no-header
    steps:
      - sql: "select read_csv('tests/fixtures/people.csv', {header: false});"
        result:
          - - {column0: name, column1: age}
            - {column0: alice, column1: 30}
            - {column0: bob, column1: 25}
