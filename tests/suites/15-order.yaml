suite: order-clause
spec_ref: "§4.6"
description: Sorts the binding-tuple stream by one or more keys (asc/desc), nulls last in asc / first in desc.

setup:
  - create table T;

tests:

  - id: order-by-asc-default
    description: order by sorts ascending by default
    steps:
      - sql: |
          insert into T ({x: 3}, {x: 1}, {x: 2});
      - sql: select t.x from T as t order by t.x;
        result: [1, 2, 3]

  - id: order-by-asc-explicit
    description: explicit asc matches the default
    steps:
      - sql: |
          insert into T ({x: 3}, {x: 1}, {x: 2});
      - sql: select t.x from T as t order by t.x asc;
        result: [1, 2, 3]

  - id: order-by-desc
    description: desc sorts descending
    steps:
      - sql: |
          insert into T ({x: 3}, {x: 1}, {x: 2});
      - sql: select t.x from T as t order by t.x desc;
        result: [3, 2, 1]

  - id: order-by-star
    description: order by reorders whole rows under select *
    steps:
      - sql: |
          insert into T ({x: 3}, {x: 1}, {x: 2});
      - sql: select * from T as t order by t.x;
        result:
          - {x: 1}
          - {x: 2}
          - {x: 3}

  - id: order-by-multi-key
    description: multiple keys sort left-to-right with per-key direction
    steps:
      - sql: |
          insert into T ({a: 1, b: 2}, {a: 1, b: 1}, {a: 2, b: 5});
      - sql: select * from T as t order by t.a, t.b desc;
        result:
          - {a: 1, b: 2}
          - {a: 1, b: 1}
          - {a: 2, b: 5}

  - id: order-by-null-last-asc
    description: null sorts after all values in ascending order
    steps:
      - sql: |
          insert into T ({x: 2}, {x: null}, {x: 1});
      - sql: select t.x from T as t order by t.x;
        result: [1, 2, null]

  - id: order-by-null-first-desc
    description: null sorts before all values in descending order
    steps:
      - sql: |
          insert into T ({x: 2}, {x: null}, {x: 1});
      - sql: select t.x from T as t order by t.x desc;
        result: [null, 2, 1]

  - id: order-by-int-float-numeric
    description: ints and floats interleave by numeric value
    steps:
      - sql: |
          insert into T ({x: 2}, {x: 1.5}, {x: 1});
      - sql: select t.x from T as t order by t.x;
        result: [1, 1.5, 2]

  - id: order-by-string
    description: strings sort lexicographically
    steps:
      - sql: |
          insert into T ({s: "banana"}, {s: "apple"}, {s: "cherry"});
      - sql: select t.s from T as t order by t.s;
        result: ["apple", "banana", "cherry"]

  - id: order-by-limit-topn
    description: order by then limit yields the top N
    steps:
      - sql: |
          insert into T ({x: 3}, {x: 1}, {x: 2}, {x: 5}, {x: 4});
      - sql: select t.x from T as t order by t.x desc limit 2;
        result: [5, 4]

  - id: order-by-after-where
    description: order sorts the post-where stream
    steps:
      - sql: |
          insert into T ({x: 3}, {x: 1}, {x: 2}, {x: 4});
      - sql: select t.x from T as t where t.x > 1 order by t.x;
        result: [2, 3, 4]

  - id: order-by-two-source
    description: order by sorts the cross product of two sources
    setup:
      - create table S;
    steps:
      - sql: |
          insert into T ({x: 2}, {x: 1});
      - sql: |
          insert into S ({y: 9});
      - sql: select * from T as t, S as s order by t.x;
        result:
          - {x: 1, y: 9}
          - {x: 2, y: 9}
