suite: params
spec_ref: "3.4"
description: >
  Query parameters. A placeholder stands in for a value supplied alongside the
  SQL text: `?` and `$N` draw from a positional list (1-based — the first `?`
  and `$1` both resolve to `list[0]`), while `$name` draws from a named map.
  The binder substitutes each placeholder with its bound literal before
  compilation, so a parameter is an ordinary expression: it rides the bare
  `select <expr>` form, composes in arithmetic, filters in `where`, and serves
  as a keyed-table index. A missing binding is a static (bind) error.

tests:

  #----------------------------------------------------------------------------
  # Positional `?`
  #----------------------------------------------------------------------------
  - id: positional-single
    description: a lone `?` resolves to the first list element
    steps:
      - sql: select ?;
        parameters: [42]
        result: [42]

  - id: positional-order
    description: each `?` consumes the next list slot in source order
    steps:
      - sql: select [?, ?, ?];
        parameters: [1, 2, 3]
        result:
          - [1, 2, 3]

  - id: positional-string
    description: a string parameter
    steps:
      - sql: select ?;
        parameters: ["hello"]
        result: ["hello"]

  - id: positional-null
    description: a null parameter
    steps:
      - sql: select ?;
        parameters: [null]
        result: [null]

  - id: positional-arithmetic
    description: parameters compose inside an expression
    steps:
      - sql: select ? + ?;
        parameters: [10, 20]
        result: [30]

  #----------------------------------------------------------------------------
  # Numbered `$N`
  #----------------------------------------------------------------------------
  - id: numbered-single
    description: "$1 is the first (1-based) list element"
    steps:
      - sql: select $1;
        parameters: [7]
        result: [7]

  - id: numbered-reuse
    description: the same index may be referenced more than once
    steps:
      - sql: select [$1, $1, $2];
        parameters: [9, 8]
        result:
          - [9, 9, 8]

  - id: numbered-out-of-order
    description: numbered references pick by index, not by appearance
    steps:
      - sql: select [$2, $1];
        parameters: ["a", "b"]
        result:
          - ["b", "a"]

  - id: positional-and-numbered-share-list
    description: "the first `?` and `$1` both resolve to list[0]"
    steps:
      - sql: select [?, $1];
        parameters: [5]
        result:
          - [5, 5]

  #----------------------------------------------------------------------------
  # Named `$name`
  #----------------------------------------------------------------------------
  - id: named-single
    description: a named parameter resolves from the map
    steps:
      - sql: select $foo;
        parameters: {foo: 99}
        result: [99]

  - id: named-multiple
    description: several named parameters
    steps:
      - sql: select [$a, $b];
        parameters: {a: 1, b: 2}
        result:
          - [1, 2]

  #----------------------------------------------------------------------------
  # In clauses: where + keyed get
  #----------------------------------------------------------------------------
  - id: where-positional
    description: a parameter as a where-clause operand
    setup:
      - create table T;
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2}, {x: 3});
      - sql: select * from T where T.x > ?;
        parameters: [1]
        result:
          - {x: 2}
          - {x: 3}

  - id: where-named
    description: a named parameter in a where clause
    setup:
      - create table T;
    steps:
      - sql: |
          insert into T ({x: 1}, {x: 2});
      - sql: select * from T where T.x = $val;
        parameters: {val: 2}
        result:
          - {x: 2}

  - id: keyed-get-positional
    description: a parameter as a keyed-table index (substituted to a literal key)
    setup:
      - create table t (id int);
    steps:
      - sql: |
          insert into t ({id: 1, v: "a"}, {id: 2, v: "b"});
      - sql: select t[?];
        parameters: [2]
        result:
          - {id: 2, v: "b"}

  #----------------------------------------------------------------------------
  # Errors — missing bindings are static (bind) errors
  #----------------------------------------------------------------------------
  - id: missing-positional
    description: "`?` with too few list elements is a bind error"
    steps:
      - sql: select [?, ?];
        parameters: [1]
        error: static

  - id: missing-numbered
    description: "$2 with a one-element list is a bind error"
    steps:
      - sql: select $2;
        parameters: [1]
        error: static

  - id: missing-named
    description: an absent named key is a bind error
    steps:
      - sql: select $foo;
        parameters: {bar: 1}
        error: static

  - id: zero-index
    description: "$0 is out of range (numbering is 1-based)"
    steps:
      - sql: select $0;
        parameters: [1]
        error: static

  - id: numbered-overflow
    description: "a numbered index past u32 is a static bind error, not an opaque lexer error"
    steps:
      - sql: select $4294967296;
        parameters: [1]
        error: static

  - id: no-parameters-supplied
    description: a placeholder with no parameters at all is a bind error
    steps:
      - sql: select ?;
        error: static
