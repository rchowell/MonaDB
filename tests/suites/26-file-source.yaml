suite: file-source
description: |
  A file path in from position is a streaming cursor, not a materialized array.
  csv/tsv/jsonl/ndjson pull one row at a time; json parses the whole document.

tests:

  - id: file-jsonl-default-alias
    description: a jsonl path binds the file stem as its alias
    steps:
      - sql: "select * from 'tests/fixtures/people.jsonl' order by people.name;"
        result:
          - {name: alice, age: 30}
          - {name: bob, age: 25}

  - id: file-explicit-alias
    description: an explicit alias names the row binding
    steps:
      - sql: "select p.name as name from 'tests/fixtures/people.jsonl' as p order by p.name;"
        result:
          - {name: alice}
          - {name: bob}

  - id: file-json-array
    description: a top-level json array is the row bag
    steps:
      - sql: "select * from 'tests/fixtures/people.json' as p order by p.name;"
        result:
          - {name: alice, age: 30}
          - {name: bob, age: 25}

  - id: file-json-object
    description: a top-level json object is a single row
    steps:
      - sql: "select * from 'tests/fixtures/single.json' as s;"
        result:
          - {name: alice, age: 30}

  - id: file-json-scalar-top-level
    description: a top-level json scalar is neither a row nor a row bag
    steps:
      - sql: "select * from 'tests/fixtures/scalar.json' as s;"
        error: storage

  - id: file-alias-not-identifier
    description: |
      the default alias is the file stem; `my-data` can never be tokenized as an
      identifier, so the binding would be unreferenceable. Demand an explicit alias.
    steps:
      - sql: "select * from 'tests/fixtures/my-data.jsonl';"
        error: static

  - id: file-alias-not-identifier-with-alias-ok
    description: an explicit alias makes an otherwise unreferenceable stem usable
    steps:
      - sql: "select d.x as x from 'tests/fixtures/my-data.jsonl' as d;"
        result:
          - {x: 1}

  - id: file-missing-path
    description: a missing file is a storage error
    steps:
      - sql: "select * from 'tests/fixtures/does-not-exist.csv' as n;"
        error: storage

  - id: file-read-csv-options-header-false
    description: the explicit read_csv spelling carries options through the lowering
    steps:
      - sql: "select * from read_csv('tests/fixtures/people.csv', {\"header\": false}) as r;"
        result:
          - {column0: name, column1: age}
          - {column0: alice, column1: 30}
          - {column0: bob, column1: 25}

  - id: file-read-csv-param-path-falls-back
    description: |
      a runtime path cannot be resolved at compile time, so it stays an eager
      value source. Graceful degradation, not an error.
    steps:
      - sql: "select r.name as name from read_csv($p) as r order by r.name;"
        parameters:
          p: tests/fixtures/people.csv
        result:
          - {name: alice}
          - {name: bob}

  - id: file-where-and-limit
    description: where and limit apply to the streamed row sequence
    steps:
      - sql: "select p.name as name from 'tests/fixtures/people.csv' as p where p.age > 26;"
        result:
          - {name: alice}
      - sql: "select p.name as name from 'tests/fixtures/people.csv' as p order by p.name limit 1;"
        result:
          - {name: alice}

  - id: file-order-by
    description: |
      order by drains the file into the sort payload, then re-seeds each from
      binding with SetVal — which replaces the cursor's file source wholesale.
    steps:
      - sql: "select p.name as name from 'tests/fixtures/people.jsonl' as p order by p.name desc;"
        result:
          - {name: bob}
          - {name: alice}

  - id: file-aggregate
    description: an aggregate streams the file without materializing it
    steps:
      - sql: "select count(*) as n from 'tests/fixtures/people.csv' as p;"
        result:
          - {n: 2}

  - id: file-cross-join-reopens
    description: |
      a file as the inner source of a nested loop is re-entered per outer row,
      so its cursor must reopen the file from the top each time.
    setup:
      - create table T;
      - "insert into T ({\"i\": 1}, {\"i\": 2});"
    teardown:
      - drop table T;
    steps:
      - sql: |
          select t.i as i, p.name as name
          from T as t, 'tests/fixtures/people.jsonl' as p
          order by t.i, p.name;
        result:
          - {i: 1, name: alice}
          - {i: 1, name: bob}
          - {i: 2, name: alice}
          - {i: 2, name: bob}

  - id: file-limit-stops-before-malformed-line
    description: |
      The streaming proof. streaming.jsonl holds 50 valid rows followed by a
      truncated 51st line. An eager reader parses the whole file before yielding
      anything, so it fails both steps; a streaming cursor never advances past
      row 3 and satisfies `limit 2`.

      The margin is deliberate: `limit N` reads N+1 rows, because cc_loop_close
      emits `Next` before the take counter short-circuits at the top of the body.

      Step 2 is the control — it proves the file really is malformed, so step 1
      passing is not a false positive.
    steps:
      - sql: "select s.n as n from 'tests/fixtures/streaming.jsonl' as s limit 2;"
        result:
          - {n: 1}
          - {n: 2}
      - sql: "select s.n as n from 'tests/fixtures/streaming.jsonl' as s;"
        error: storage
