suite: cast
spec_ref: "5.1"
description: >
  Type conversions — the scalar type names are callable as conversion functions:
  int(x), float(x), string(x), bool(x), number(x). They desugar to per-type
  builtins, so null propagates (a null cast is null), bad conversions are runtime
  errors, and a non-scalar target name (object, array, any) is a syntax error.
  Float→int truncates toward zero; string→number parsing is lenient (trims
  whitespace, accepts float syntax for int targets). Note: MonaDB has no unary
  minus, so negatives are written as literals.

tests:
  #----------------------------------------------------------------------------
  # int(x) — truncate toward zero, lenient string parse, bool→0/1
  #----------------------------------------------------------------------------
  - id: cast-int
    description: int(x) over int, float, string, and bool sources
    steps:
      - sql: select int(7);
        result: [7]
      - sql: select int(2.7);
        result: [2]
      - sql: select int(-2.7);
        result: [-2]
      - sql: select int(2.0);
        result: [2]
      - sql: select int('5');
        result: [5]
      - sql: "select int(' 5 ');"
        result: [5]
      - sql: select int('2.7');
        result: [2]
      - sql: select int(true);
        result: [1]
      - sql: select int(false);
        result: [0]
      # exact integer-string truncation, beyond f64's 53-bit mantissa
      # (compared via = so the i64 is checked directly, not collapsed to f64)
      - sql: select int('9007199254740993.0') = 9007199254740993;
        result: [true]

  #----------------------------------------------------------------------------
  # float(x) — widen ints, parse strings, bool→0.0/1.0
  #----------------------------------------------------------------------------
  - id: cast-float
    description: float(x) over int, float, string, and bool sources
    steps:
      - sql: select float(3);
        result: [3.0]
      - sql: select float(2.5);
        result: [2.5]
      - sql: select float('1.5');
        result: [1.5]
      - sql: select float('4');
        result: [4.0]
      - sql: select float(true);
        result: [1.0]
      - sql: select float(false);
        result: [0.0]

  #----------------------------------------------------------------------------
  # string(x) — scalar text form (total; never errors)
  #----------------------------------------------------------------------------
  - id: cast-string
    description: string(x) renders a scalar as text
    steps:
      - sql: select string(42);
        result: ["42"]
      - sql: select string(1.5);
        result: ["1.5"]
      - sql: select string(true);
        result: ["true"]
      - sql: select string(false);
        result: ["false"]
      - sql: select string('hi');
        result: ["hi"]

  #----------------------------------------------------------------------------
  # bool(x) — zero is false, true/false strings (case-insensitive)
  #----------------------------------------------------------------------------
  - id: cast-bool
    description: bool(x) over numbers and the true/false strings
    steps:
      - sql: select bool(0);
        result: [false]
      - sql: select bool(1);
        result: [true]
      - sql: select bool(5);
        result: [true]
      - sql: select bool(0.0);
        result: [false]
      - sql: select bool(2.5);
        result: [true]
      - sql: select bool('true');
        result: [true]
      - sql: select bool('false');
        result: [false]
      - sql: select bool('TRUE');
        result: [true]

  #----------------------------------------------------------------------------
  # number(x) — preserves int vs float, parses numeric strings
  #----------------------------------------------------------------------------
  - id: cast-number
    description: number(x) keeps the int/float-ness of the value
    steps:
      - sql: select number(7);
        result: [7]
      - sql: select number(2.5);
        result: [2.5]
      - sql: select number('7');
        result: [7]
      - sql: select number('1.5');
        result: [1.5]
      - sql: select number(true);
        result: [1]
      - sql: select number('5.0');
        result: [5.0]

  #----------------------------------------------------------------------------
  # composition — casts are ordinary expressions that nest and combine
  #----------------------------------------------------------------------------
  - id: cast-compose
    description: a cast is a normal call — it nests and combines with operators
    steps:
      - sql: select int('5') + 1;
        result: [6]
      - sql: select int(2.9) + 1;
        result: [3]
      - sql: "select int({\"a\": 2.9}.a);"
        result: [2]
      - sql: select int(float('2.7'));
        result: [2]

  #----------------------------------------------------------------------------
  # null passthrough — casting null yields null for every target
  #----------------------------------------------------------------------------
  - id: cast-null
    description: a null argument short-circuits to null
    steps:
      - sql: select int(null);
        result: [null]
      - sql: select float(null);
        result: [null]
      - sql: select string(null);
        result: [null]
      - sql: select bool(null);
        result: [null]
      - sql: select number(null);
        result: [null]

  #----------------------------------------------------------------------------
  # round-trip — typeof confirms the produced runtime type
  #----------------------------------------------------------------------------
  - id: cast-typeof
    description: typeof(t(x)) reports the target type
    steps:
      - sql: select typeof(int(2.7));
        result: ["int"]
      - sql: select typeof(float(5));
        result: ["float"]
      - sql: select typeof(number(5));
        result: ["int"]
      - sql: select typeof(number(2.5));
        result: ["float"]
      - sql: select typeof(string(1));
        result: ["string"]
      - sql: select typeof(bool(1));
        result: ["bool"]
      # string- and bool-sourced casts also produce the right variant
      # (typeof distinguishes int from float where the value comparison can't)
      - sql: select typeof(float('4'));
        result: ["float"]
      - sql: select typeof(number('7'));
        result: ["int"]
      - sql: select typeof(number('5.0'));
        result: ["float"]
      - sql: select typeof(number(true));
        result: ["int"]

  #----------------------------------------------------------------------------
  # runtime errors — unparseable strings, non-castable types, overflow
  #----------------------------------------------------------------------------
  - id: cast-error-runtime
    description: bad conversions fail at runtime
    steps:
      - sql: select int('abc');
        error: runtime
      - sql: "select int([1]);"
        error: runtime
      - sql: select bool('x');
        error: runtime
      - sql: select int(1e19);
        error: runtime
      - sql: "select float([1, 2]);"
        error: runtime
      # non-finite parses must error, not yield a NaN/inf Value
      - sql: select int('inf');
        error: runtime
      - sql: select float('nan');
        error: runtime
      - sql: select float('inf');
        error: runtime
      # string() converts scalars only — arrays/objects are not convertible
      - sql: "select string([1, 2]);"
        error: runtime
      - sql: "select string({\"a\": 1});"
        error: runtime

  #----------------------------------------------------------------------------
  # syntax errors — only scalar type names are callable as casts
  #----------------------------------------------------------------------------
  - id: cast-error-syntax
    description: object/array/any are not callable conversion functions
    steps:
      - sql: select object(1);
        error: syntax
      - sql: "select array(1);"
        error: syntax
      - sql: select any(1);
        error: syntax
