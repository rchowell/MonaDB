name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --lib

      - name: Conformance tests
        run: cargo test --test conformance
        continue-on-error: true

      - name: Build CLI
        run: cargo build --features cli --bin monadb

      - name: CLI version
        run: ./target/debug/monadb --version

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install "maturin>=1.7,<2" pytest

      - name: Build extension
        run: maturin build --release --features python

      - name: Install wheel and test
        run: |
          pip install target/wheels/*.whl
          pytest monadb/tests
