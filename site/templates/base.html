<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MonaDB{% endblock title %}</title>
  <meta name="description" content="{% block description %}MonaDB — an embedded database with a query language of its own{% endblock description %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <script src="{{ get_url(path='grain.js') }}" defer></script>
</head>
<body>

  <header class="sticky top-0 z-30 bg-page border-b-rule">
    <div class="{% if current_path == '/' %}max-w-wrap mx-auto {% endif %}px-8 py-3.5 flex items-center justify-between">
      <a class="flex items-center gap-3.5" href="{{ get_url(path='/') }}">
        <span class="grain-mark" aria-hidden="true"></span>
        <span class="font-display text-[17px] font-black tracking-[0.16em] text-ink">MonaDB</span>
      </a>
      <nav class="flex items-center gap-[22px] max-sm:gap-[14px]">
        <a class="font-label text-[10px] tracking-[0.12em] uppercase {% if current_path is containing('/language/') %}text-accent{% else %}text-ink hover:underline{% endif %}"
           href="{{ get_url(path='@/language/introduction.md') }}">Language</a>
        <a class="font-label text-[10px] tracking-[0.12em] uppercase {% if current_path is containing('/design/') %}text-accent{% else %}text-ink hover:underline{% endif %}"
           href="{{ get_url(path='@/design.md') }}">Design</a>
        <a class="font-label text-[10px] tracking-[0.12em] uppercase text-ink hover:underline"
           href="https://github.com/rchowell/MonaDB">GitHub</a>
        <span class="max-sm:hidden">
          <a class="btn btn-primary btn-sm" href="{{ get_url(path='@/language/introduction.md') }}">Get Started</a>
        </span>
      </nav>
    </div>
  </header>

  {% block content %}{% endblock content %}

  <footer class="border-t-rule">
  <div class="max-w-wrap mx-auto px-8 pt-12 pb-16">
    <div class="grid grid-cols-[repeat(auto-fit,minmax(160px,1fr))] gap-8">
      <div>
        <div class="flex items-center gap-[10px] mb-3.5">
          <span class="grain-mark" aria-hidden="true"></span>
          <span class="font-display text-[15px] font-black tracking-[0.14em]">MONADB</span>
        </div>
        <p class="text-[12px] leading-[1.6] text-mist max-w-[30ch]">An embedded database with a query language of its own. Ink on disk.</p>
      </div>
      <div>
        <div class="font-label text-[10px] tracking-[0.12em] uppercase text-mist mb-3.5">Reference</div>
        <div class="flex flex-col gap-[9px] font-body text-[13px]">
          <a class="text-ink hover:underline" href="{{ get_url(path='@/language/introduction.md') }}">Introduction</a>
          <a class="text-ink hover:underline" href="{{ get_url(path='@/language/statements.md') }}">Statements</a>
          <a class="text-ink hover:underline" href="{{ get_url(path='@/language/syntax.md') }}">Syntax</a>
          <a class="text-ink hover:underline" href="{{ get_url(path='@/language/types.md') }}">Types</a>
        </div>
      </div>
      <div>
        <div class="font-label text-[10px] tracking-[0.12em] uppercase text-mist mb-3.5">Language</div>
        <div class="flex flex-col gap-[9px] font-body text-[13px]">
          <a class="text-ink hover:underline" href="{{ get_url(path='@/language/expressions.md') }}">Expressions</a>
          <a class="text-ink hover:underline" href="{{ get_url(path='@/language/functions.md') }}">Functions</a>
          <a class="text-ink hover:underline" href="{{ get_url(path='@/design.md') }}">Design</a>
        </div>
      </div>
      <div>
        <div class="font-label text-[10px] tracking-[0.12em] uppercase text-mist mb-3.5">Project</div>
        <div class="flex flex-col gap-[9px] font-body text-[13px]">
          <a class="text-ink hover:underline" href="https://github.com/rchowell/MonaDB">GitHub</a>
          <a class="text-ink hover:underline" href="https://github.com/rchowell/MonaDB#readme">README</a>
        </div>
      </div>
    </div>
    <div class="flex flex-wrap gap-[14px] justify-between mt-10 pt-[18px] border-t-rule font-label text-[10px] tracking-[0.1em] uppercase text-mist">
      <span>© 2026 MonaDB</span>
      <span>Seattle, WA</span>
    </div>
  </div>
  </footer>

</body>
</html>
